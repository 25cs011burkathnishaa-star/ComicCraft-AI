<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Comic Preview - ComicCraft</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 30px;
        }
        .panel-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 30px;
            padding: 20px;
            background: #fafafa;
        }
        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }
        .panel-image {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 6px;
            background: #000;
            margin-bottom: 15px;
        }
        .scene-desc {
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
        }
        .story-text {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            color: #222;
        }
        .download-section {
            text-align: center;
            margin-top: 40px;
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn-download:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Your Comic Preview</h1>
        
        {% for panel in layout %}
        <div class="panel-card">
            <div class="panel-title">Panel {{ panel.panel }}: {{ panel.title }}</div>
            <img src="/{{ panel.image_path }}" alt="Panel {{ panel.panel }} Illustration" class="panel-image">
            <div class="scene-desc">{{ panel.scene_description }}</div>
            <div class="story-text">{{ panel.text }}</div>
        </div>
        {% endfor %}

        <div class="download-section">
            <a href="/export-success?pdf_path={{ pdf_path }}" class="btn-download">Download Your Comic as PDF</a>
        </div>
    </div>
</body>
</html>
